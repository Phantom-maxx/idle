<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyIDE</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />

    <script src="https://cdn.jsdelivr.net/npm/idb@7/build/umd.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
</head>
<body>

<div class="app">

    <header class="topbar">
        <div class="logo-section">
            <div class="logo">PyIDE</div>
            <div class="subtitle">Offline Python Workspace</div>
        </div>

        <div class="actions">
            <button id="runBtn">Run</button>
            <button id="stopBtn">Stop</button>
            <button id="saveBtn">Save</button>
            <button id="newBtn">New File</button>
        </div>
    </header>

    <main class="main-layout">
        <aside class="sidebar">

            <div class="sidebar-title">
                FILES
            </div>

            <div id="sidebar"></div>

        </aside>

        <section class="editor-section">
            <textarea id="editor"></textarea>
        </section>
    </main>

    <section class="terminal-wrapper">

        <div class="terminal-header">
            TERMINAL
        </div>

        <section class="terminal" id="terminal"></section>

    </section>
</div>

<div id="commandPalette" class="palette hidden">
    <input type="text"
           id="commandInput"
           placeholder="Type a command..." />
</div>

<div class="libs-modal hidden" id="libsModal">

    <div class="libs-box">

        <div class="libs-header">
            Python Libraries
        </div>

        <input
            type="text"
            id="libInput"
            placeholder="Enter package name..."
        />

        <button id="installLibBtn">
            Install
        </button>

        <div id="installedLibs"></div>

    </div>

</div>
    
<script type="module" src="js/app.js"></script>

</body>
</html>
